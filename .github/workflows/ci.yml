name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure crash dump collection (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "triax-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
      - name: Configure
        run: cmake -S . -B build -DTRIAX_BUILD_EXAMPLES=ON -DBUILD_TESTING=ON
      - name: Build
        # RelWithDebInfo instead of Release: on multi-config generators (MSVC
        # on windows-latest) this produces real PDBs without materially
        # changing optimization behavior. Single-config generators (the
        # ubuntu-latest/macos-latest Makefiles builds) ignore --config
        # entirely here, since no CMAKE_BUILD_TYPE was set at configure time
        # — so this only actually changes anything on Windows.
        run: cmake --build build --config RelWithDebInfo
      - name: Test
        id: test
        continue-on-error: true
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - name: Diagnose C++ failure (Windows)
        if: ${{ always() && runner.os == 'Windows' && steps.test.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Host "=== Full C++ run ==="
          & .\build\RelWithDebInfo\triax-selftest-cpp.exe --no-color --verbosity=always
          Write-Host "exit code: $LASTEXITCODE"

          Write-Host "=== Deliberate failure only ==="
          & .\build\RelWithDebInfo\triax-selftest-cpp.exe --no-color --verbosity=always "debug::deliberate_failure"
          Write-Host "exit code: $LASTEXITCODE"

          exit 0
      - name: Upload crash dumps (Windows)
        if: ${{ always() && runner.os == 'Windows' && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-dumps
          path: |
            ${{ runner.temp }}/triax-dumps/*.dmp
            build/**/*.pdb
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if tests failed
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1

  # Compiler-policy testing (does our source satisfy our warning policy?)
  # deliberately lives here, not in the native matrix above: native answers
  # "does Triax work on each platform", this answers "is each compiler
  # family we maintain a warning set for (GNU_COMMON/GCC_EXTRA/CLANG_EXTRA/
  # MSVC in CMakeLists.txt) actually clean under -Werror/-WX". GCC and Clang
  # share a build/test shape on the same OS, so they're one matrix; MSVC
  # needs Windows-specific config/build syntax, so it's the separate
  # strict-warnings-msvc job below instead of forcing it into this matrix.
  strict-warnings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        if: matrix.compiler.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (warnings-as-errors)
        run: cmake -S . -B build -DTRIAX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MSVC side of strict-warnings above: /WX has never actually been enforced
  # in CI before this job existed, so — like msvc-sanitizers below — this is
  # untested territory the first time it runs, hence the same crash-dump
  # safety net as the other Windows jobs even though a -Werror-style failure
  # here is expected to just be a clean compile error, not a crash.
  strict-warnings-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure crash dump collection
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "triax-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
      - name: Configure (MSVC, warnings-as-errors)
        run: cmake -S . -B build -DTRIAX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo
      - name: Test
        id: test
        continue-on-error: true
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - name: Upload crash dumps
        if: ${{ always() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: strict-warnings-msvc-crash-dumps
          path: |
            ${{ runner.temp }}/triax-dumps/*.dmp
            build/**/*.pdb
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if tests failed
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1

  clang-sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (Clang, ASan+UBSan)
        # -O1 -g (not the default no-optimization build): sanitizer overhead
        # at -O0 was enough to make timing-sensitive tests (e.g. combo_fixture's
        # concurrency checks) flaky, since TRIAX_ENABLE_SANITIZERS sets no
        # optimization level and this project never sets CMAKE_BUILD_TYPE.
        run: cmake -S . -B build -DTRIAX_ENABLE_SANITIZERS=ON -DBUILD_TESTING=ON -DCMAKE_C_FLAGS="-O1 -g" -DCMAKE_CXX_FLAGS="-O1 -g"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MSVC only implements AddressSanitizer (no UBSan/TSan/MSan, unlike the
  # Clang job above) — see TRIAX_ENABLE_SANITIZERS's MSVC branch in
  # CMakeLists.txt. Not adding GCC ASan+UBSan or TSan/MSan anywhere: Clang
  # already gives solid Linux runtime coverage, GCC is independently
  # exercised by strict-warnings, and TSan/MSan don't target Triax's actual
  # risk profile (isolation is process-based, not shared-memory threading).
  msvc-sanitizers:
    runs-on: windows-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - name: Configure crash dump collection
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "triax-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
      - name: Configure (MSVC, ASan)
        run: cmake -S . -B build -DTRIAX_ENABLE_SANITIZERS=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo
      - name: Test
        id: test
        continue-on-error: true
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - name: Upload crash dumps
        if: ${{ always() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: msvc-sanitizers-crash-dumps
          path: |
            ${{ runner.temp }}/triax-dumps/*.dmp
            build/**/*.pdb
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if tests failed
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1

  # Always-on regression coverage for the Release-optimization-sensitive
  # section-walk bug fixed in TRIAXI_SECTION_INIT_MSVC (triax.h): a pointer
  # walked past a single object's declared bounds miscompiled under MSVC
  # /Ob2 (full inlining) but not /Ob1, producing a deterministic SegFault
  # reading exactly at the end of the module's own mapped image. The
  # ordinary `native` job runs RelWithDebInfo (/Ob1, for PDBs) and would
  # never have caught this; this job builds actual Release instead, keeping
  # /Zi + /DEBUG (via plain CMAKE_*_FLAGS, not a permanent CMakeLists.txt
  # change) so a regression here is still fully diagnosable. Runs the
  # affected tests once per push — see windows-release-stress below for the
  # manual, higher-confidence 30x version of this same configuration.
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure crash dump collection
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "triax-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
      - name: Configure (Release, kept symbols)
        # -DCMAKE_CXX_FLAGS="/Zi" (an earlier version of this step) replaces
        # CMake's entire default general-flags string on the command line
        # rather than appending to it — and for MSVC that default is where
        # /EHsc lives (seeded via Windows-MSVC.cmake's CMAKE_CXX_FLAGS_INIT),
        # not in the per-config Release flags. That silently built every
        # C++ TU without exception-unwind semantics (MSVC warns C4530),
        # invalidating the whole comparison this job exists to make. Fixed
        # by leaving CMAKE_CXX_FLAGS/CMAKE_C_FLAGS untouched (so /EHsc stays)
        # and reconstructing the full CMAKE_*_FLAGS_RELEASE default
        # explicitly instead, since the same override-not-append rule
        # applies there too.
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON `
            -DCMAKE_C_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi" `
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi" `
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="/INCREMENTAL:NO /DEBUG"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        id: test
        continue-on-error: true
        run: ctest --test-dir build -C Release -R "triax-cpp$|triax-cpp-parallel$" --output-on-failure
      - name: Upload crash dumps
        if: ${{ always() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-crash-dumps
          path: |
            ${{ runner.temp }}/triax-dumps/*.dmp
            build/**/*.pdb
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if tests failed
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1

  # Manual-only, higher-confidence version of windows-release above: the
  # crash this configuration exists to catch was intermittent (didn't
  # reproduce every run) before it was root-caused and fixed, so this
  # repeats the affected tests many times rather than once. Not run on
  # every push: 30 repeats of the C++ suite is standing insurance worth
  # paying for occasionally, not on every commit, when windows-release
  # above already provides permanent single-pass coverage of the same
  # configuration.
  windows-release-stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure crash dump collection
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "triax-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
      - name: Configure (Release, kept symbols)
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON `
            -DCMAKE_C_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi" `
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi" `
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="/INCREMENTAL:NO /DEBUG"
      - name: Build
        run: cmake --build build --config Release
      - name: Stress C++ Release
        id: stress
        continue-on-error: true
        shell: pwsh
        run: |
          for ($i = 1; $i -le 30; $i++) {
            Write-Host "=== iteration $i ==="
            ctest --test-dir build -C Release -R "triax-cpp$|triax-cpp-parallel$" --output-on-failure
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed on iteration $i"
              exit $LASTEXITCODE
            }
          }
      - name: Upload crash dumps
        if: ${{ always() && steps.stress.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-stress-crash-dumps
          path: |
            ${{ runner.temp }}/triax-dumps/*.dmp
            build/**/*.pdb
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail if stress run failed
        if: ${{ always() && steps.stress.outcome == 'failure' }}
        run: exit 1
