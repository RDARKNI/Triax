name: CI

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DTRIAX_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  strict-warnings:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Configure (GCC, warnings-as-errors)
        run: cmake -S . -B build -DTRIAX_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (Clang, sanitizers)
        # -O1 -g (not the default no-optimization build): sanitizer overhead
        # at -O0 was enough to make timing-sensitive tests (e.g. combo_fixture's
        # concurrency checks) flaky, since TRIAX_ENABLE_SANITIZERS sets no
        # optimization level and this project never sets CMAKE_BUILD_TYPE.
        run: cmake -S . -B build -DTRIAX_ENABLE_SANITIZERS=ON -DBUILD_TESTING=ON -DCMAKE_C_FLAGS="-O1 -g" -DCMAKE_CXX_FLAGS="-O1 -g"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
